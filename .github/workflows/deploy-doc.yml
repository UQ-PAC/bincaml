name: docs

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: read-all

concurrency:
  group: deploy-odoc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-odoc:
    name: Build odoc
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/bincaml-setup

      - name: Build documentation
        run: |
          opam pin add .
          opam exec -- odoc_driver bincaml

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _html

  deploy-odoc:
    name: Deploy odoc to GitHub Pages
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}

    needs: build-odoc

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      id-token: write
      pages: write

    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
